name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: Launcher checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/prepare-assets.py --check
      - run: python scripts/build-asset-catalogue.py --check
      - run: python scripts/check-docs.py
      - run: python scripts/check-repo.py
      - run: python scripts/package.py

  latex:
    name: Native TeX and isolated Overleaf builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo python3-cairo gir1.2-rsvg-2.0 inkscape poppler-utils \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra biber
      - name: Test both artwork converters
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 scripts/prepare-assets.py --check
      - name: Build and verify release artifacts
        run: python3 scripts/release.py
      - name: Ensure builds did not rewrite source or prepared artwork
        run: |
          python3 scripts/check-repo.py
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/bitbeamer-overleaf.zip
            dist/bitbeamer-preview.pdf
            dist/bitbeamer-illustrations.pdf
            dist/bitbeamer-catalogue.pdf
            dist/bitbeamer-icon-cheatsheet.pdf
            dist/bitbeamer-cover-layouts.pdf


  release:
    name: Publish versioned template
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [portability, latex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files
      - name: Publish ZIP and PDF previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes \
            release-files/bitbeamer-overleaf.zip \
            release-files/bitbeamer-preview.pdf \
            release-files/bitbeamer-illustrations.pdf \
            release-files/bitbeamer-catalogue.pdf \
            release-files/bitbeamer-icon-cheatsheet.pdf \
            release-files/bitbeamer-cover-layouts.pdf
