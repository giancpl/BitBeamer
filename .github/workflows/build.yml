name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: Launcher checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/deck.py layouts --json
      - run: python scripts/library.py check
      - run: python scripts/prepare-assets.py --check
      - run: python scripts/prepare-studio-assets.py --check
      - run: python scripts/build-asset-catalogue.py --check
      - run: python scripts/build-studio-catalogue.py --check
      - run: python scripts/studio_collection.py check
      - run: python scripts/catalogue-studio-collection.py --check
      - run: python scripts/check-docs.py
      - run: python scripts/review.py check
      - run: python scripts/package.py --style all --review

  latex:
    name: Native TeX and isolated Overleaf builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-gi python3-gi-cairo python3-cairo gir1.2-rsvg-2.0 inkscape poppler-utils python3-pil \
            latexmk texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-lang-greek \
            texlive-bibtex-extra biber
      - name: Test both artwork converters
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 scripts/prepare-assets.py --check
      - name: Check the unified offline slide guide
        run: |
          python3 scripts/slide_guide.py check
          python3 scripts/guide_previews.py check
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exercise the offline slide guide in Chromium
        run: node scripts/check-slide-guide-browser.mjs
      - name: Build the default Studio entry point and both editable starters
        run: |
          python3 scripts/build.py --backend native
          python3 scripts/build.py start-academic.tex --backend native
          python3 scripts/build.py start-studio.tex --backend native
          python3 scripts/build.py examples/studio-customization.tex --backend native
          python3 scripts/review.py models --backend native
      - name: Verify isolated private deck authoring and expected diagnostics
        run: python3 scripts/check-deck-workflow.py --backend native
      - name: Compile official lesson and block sources independently
        run: |
          python3 scripts/library.py check
          python3 scripts/check_lesson_runtime.py --backend native
          python3 scripts/check_lesson_workflow.py --backend native
          python3 scripts/library.py build --all --backend native --jobs 2
      - name: Build and verify release artifacts
        run: python3 scripts/release.py --review --backend native
      - name: Verify typed Studio content and expected errors
        run: python3 scripts/check-studio-content.py --backend native
      - name: Compile the complete Studio library
        run: python3 scripts/review.py all --backend native
      - name: Require approval and validate stable artifacts on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release.py --backend native
      - name: Verify standalone Studio review projects
        run: |
          python3 scripts/package-studio-review.py
          python3 scripts/validate-studio-review.py --backend native
      - name: Ensure builds did not rewrite source or prepared artwork
        run: |
          python3 scripts/check-repo.py
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          if-no-files-found: error
          path: |
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-studio-overleaf.zip
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-studio-preview.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-studio-templates.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-academic-overleaf.zip
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-academic-preview.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-overleaf.zip
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-preview.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-illustrations.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-catalogue.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-icon-cheatsheet.pdf
            ${{ startsWith(github.ref, 'refs/tags/v') && 'dist' || 'build/review/release' }}/bitbeamer-cover-layouts.pdf


  release:
    name: Publish versioned template
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [portability, latex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files
      - name: Publish ZIP and PDF previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes \
            release-files/bitbeamer-studio-overleaf.zip \
            release-files/bitbeamer-studio-preview.pdf \
            release-files/bitbeamer-studio-templates.pdf \
            release-files/bitbeamer-academic-overleaf.zip \
            release-files/bitbeamer-academic-preview.pdf \
            release-files/bitbeamer-overleaf.zip \
            release-files/bitbeamer-preview.pdf \
            release-files/bitbeamer-illustrations.pdf \
            release-files/bitbeamer-catalogue.pdf \
            release-files/bitbeamer-icon-cheatsheet.pdf \
            release-files/bitbeamer-cover-layouts.pdf
